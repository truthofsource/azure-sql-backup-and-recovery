<text x="600.0" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Azure SQL database</text>
<text x="600.0" y="266" text-anchor="middle" font-size="14" fill="#40556b">Stores the platform's operational business</text>
<text x="600.0" y="284" text-anchor="middle" font-size="14" fill="#40556b">records.</text>
</g>
<g data-node="n1_0"><rect x="425.0" y="404" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="416" data-purpose-icon="n1_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="10" cy="5" rx="8" ry="3" /><path d="M2 5v13c0 3 10 4 15 1M2 11c0 3 12 4 16 1V5" /><path d="M15 16h5v6m0-6-6 6" /></g></svg>
<text x="600.0" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Azure-managed backups</text>
<text x="600.0" y="504" text-anchor="middle" font-size="14" fill="#40556b">Keeps recovery data for supported points in</text>
<text x="600.0" y="522" text-anchor="middle" font-size="14" fill="#40556b">time.</text>
</g>
<g data-node="n2_0"><rect x="425.0" y="642" width="350" height="170" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="654" data-purpose-icon="n2_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#996e23" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#996e23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 3" /></g></svg>
<text x="600.0" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Exact recovery selection</text>
<text x="600.0" y="742" text-anchor="middle" font-size="14" fill="#40556b">Chooses the source, recovery time and</text>
<text x="600.0" y="760" text-anchor="middle" font-size="14" fill="#40556b">isolated destination.</text>
</g>
<g data-node="n3_0"><rect x="425.0" y="880" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="892" data-purpose-icon="n3_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0" /></g></svg>
<text x="600.0" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Isolated restored database</text>
<text x="600.0" y="980" text-anchor="middle" font-size="14" fill="#40556b">Keeps the restored copy disconnected from</text>
<text x="600.0" y="998" text-anchor="middle" font-size="14" fill="#40556b">live application work.</text>
</g>
<g data-node="n4_0"><rect x="233.0" y="1118" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="390.0" y="1130" data-purpose-icon="n4_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="15" height="18" rx="2" /><path d="M9 4V2h7v2m-9 6 1 1 2-2m2 1h5m-10 5 1 1 2-2m2 1h5m-10 4h10" /></g></svg>
<text x="408.0" y="1190" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Data / access checks</text>
<text x="408.0" y="1218" text-anchor="middle" font-size="14" fill="#40556b">Checks restored records and who can access</text>
<text x="408.0" y="1236" text-anchor="middle" font-size="14" fill="#40556b">them.</text>
</g>
<g data-node="n4_1"><rect x="617.0" y="1118" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="774.0" y="1130" data-purpose-icon="n4_1"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#745386" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#745386" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6" /><path d="m12 12 10 10m-4-4 3-3m-6 0 3-3M6 6h.1" /></g></svg>
<text x="792.0" y="1190" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Dependent material</text>
<text x="792.0" y="1218" text-anchor="middle" font-size="14" fill="#40556b">Accounts for the keys and files the database</text>
<text x="792.0" y="1236" text-anchor="middle" font-size="14" fill="#40556b">still depends on.</text>
</g>
<g data-node="n5_0"><rect x="425.0" y="1356" width="350" height="170" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="1368" data-purpose-icon="n5_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#996e23" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#996e23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="15" height="18" rx="2" /><path d="M9 4V2h7v2m-9 6 1 1 2-2m2 1h5m-10 5 1 1 2-2m2 1h5m-10 4h10" /></g></svg>
<text x="600.0" y="1428" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Separate recovery decision</text>
<text x="600.0" y="1456" text-anchor="middle" font-size="14" fill="#40556b">Reviews next actions; a database restore is</text>
<text x="600.0" y="1474" text-anchor="middle" font-size="14" fill="#40556b">only one part.</text>
</g>
