name: SQL recovery reference validation
# Manual-only; no Azure credentials, provider requests or hosted run on a push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check fictional preparation boundaries
        run: python -B -m unittest discover -s tests -v
      - name: Run local demonstration
        run: python -B -m lab demo
